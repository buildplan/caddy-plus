name: Check for New Rate Limit Commits

on:
  schedule:
    - cron: '30 3 * * *' # Runs at 03:30 daily
  workflow_dispatch:

jobs:
  check-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get latest rate limit commit
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_SHA=$(gh api /repos/mholt/caddy-ratelimit/commits/master --jq .sha | cut -c 1-7)
          echo "Latest Upstream SHA: $UPSTREAM_SHA"

          if gh release list --json tagName --jq '.[].tagName' | grep -q -- "-rl-${UPSTREAM_SHA}"; then
            echo "✅ Release containing -rl-${UPSTREAM_SHA} already exists. Skipping build."
            echo "trigger=false" >> $GITHUB_OUTPUT
          else
            echo "🚀 New Caddy Rate Limit commit ${UPSTREAM_SHA} detected! Triggering build."
            echo "trigger=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger build workflow
        if: steps.check.outputs.trigger == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: ratelimit-release
